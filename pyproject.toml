[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-landscape"
version = "0.1.0"
description = "JAX-based energy landscape analysis"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "jax-md @ git+https://github.com/nbzy1995/jax-md.git@1d768f9051d552662bd861dd589e71c6bb236c57",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
demo = ["matplotlib", "pillow"]
notebooks = ["ipykernel", "ipywidgets", "plotly", "nbformat"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "pytest-xdist",  # for parallel testing
    "black",         # code formatting
    "isort",         # import sorting
    "flake8",        # linting
    "mypy",          # type checking
]

[tool.setuptools.packages.find]
include = ["jax_landscape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
